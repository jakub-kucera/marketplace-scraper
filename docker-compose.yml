  postgres:
    image: postgres:15.2
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file: .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
  tor_proxy:
    image: dperson/torproxy
    restart: always
    ports:
      - "9050:9050"
      - "9051:9051"
      - "8118:8118"
    environment:
      TORUSER: root
      PASSWORD: root
#      LOCATION: CZE
      TOR_NewCircuitPeriod: 9999999
