services:
  marketplace_scraper:
    build: .
    restart: always
    env_file: .env
    environment:
      TOR_PROXY_IP: tor_proxy
      PYTHONUNBUFFERED: 1
    volumes:
      - .:/app
    depends_on:
      - postgres
      - tor_proxy

  marketplace_filter:
    build: .
    restart: always
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    command: ["python", "manage.py", "run_filter"]
    volumes:
      - .:/app
    depends_on:
      - postgres

  marketplace_sender:
    build: .
    restart: always
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    command: ["python", "manage.py", "run_sender"]
    volumes:
      - .:/app
    depends_on:
      - postgres

  marketplace_server:
    build: .
    restart: always
    env_file: .env
    environment:
      TOR_PROXY_IP: tor_proxy
      PYTHONUNBUFFERED: 1
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - tor_proxy

  postgres:
    image: postgres:15.2
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file: .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

  tor_proxy:
    image: dperson/torproxy
    restart: always
    ports:
      - "9050:9050"
      - "9051:9051"
      - "8118:8118"
    environment:
      TORUSER: root
      PASSWORD: root
#      LOCATION: CZE
      TOR_NewCircuitPeriod: 9999999
