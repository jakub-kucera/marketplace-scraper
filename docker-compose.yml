# POSTGRES_HOST is pinned per-service below rather than left to .env, the same way the
# backup service already does it. `environment:` overrides `env_file:`, so containers always
# reach the `postgres` service by its compose name — which frees .env's POSTGRES_HOST to be
# the value host-side tooling needs (`localhost`), for `pytest` and a non-containerised
# `manage.py`. Before this, .env had to say `postgres` for the containers, and nothing on the
# host could connect at all.
services:
  marketplace_scraper:
    build: .
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      TOR_PROXY_IP: tor_proxy
      PYTHONUNBUFFERED: 1
    volumes:
      - .:/app
    depends_on:
      - postgres
      - tor_proxy

  # One worker by construction — see Q_CLUSTER in settings.py. This process is what runs
  # every scheduled and on-demand job, so if it is down, background work silently stops:
  # the `cluster-heartbeat` schedule exists to make that silence visible.
  marketplace_qcluster:
    build: .
    restart: always
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_HOST: postgres
      TOR_PROXY_IP: tor_proxy
    command: ["python", "manage.py", "qcluster"]
    volumes:
      - .:/app
    depends_on:
      - postgres
      - tor_proxy

  marketplace_filter:
    build: .
    restart: always
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_HOST: postgres
    command: ["python", "manage.py", "run_filter"]
    volumes:
      - .:/app
    depends_on:
      - postgres

  marketplace_sender:
    build: .
    restart: always
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_HOST: postgres
    command: ["python", "manage.py", "run_sender"]
    volumes:
      - .:/app
    depends_on:
      - postgres

  marketplace_server:
    build: .
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      TOR_PROXY_IP: tor_proxy
      PYTHONUNBUFFERED: 1
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - tor_proxy

  # restart: always is what brings the database back after a reboot. Without it the app
  # containers return on their own and fail to resolve `postgres` (2026-10-16).
  postgres:
    image: postgres:15.2
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file: .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # Nightly pg_dump → ./backups/ → restic off-host. See docs/BACKUPS.md.
  #
  # `profiles` keeps this OUT of `docker compose up -d`: it is a one-shot task, not
  # a service, so nothing idles waiting for 03:30. A systemd timer on the host runs
  # it (backup/systemd/) — `docker compose run` enables the profile automatically.
  #
  # Deliberately NOT a Job in the app's own worker: backups have to keep working
  # when the application is broken.
  backup:
    build: ./backup
    profiles: ["backup"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

  tor_proxy:
    image: dperson/torproxy
    restart: always
    ports:
      - "9050:9050"
      - "9051:9051"
      - "8118:8118"
    environment:
      TORUSER: root
      PASSWORD: root
#      LOCATION: CZE
      TOR_NewCircuitPeriod: 9999999
