name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up venv and install Poetry
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip packaging
          .venv/bin/pip install poetry

      - name: Install dependencies
        run: .venv/bin/poetry install

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
        run: .venv/bin/poetry run pytest
