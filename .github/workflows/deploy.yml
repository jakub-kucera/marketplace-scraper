name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/user/marketplace-scrapper

    steps:
      - name: Checkout tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/jakub-kucera/marketplace-scrapper.git
          git fetch --tags origin
          git checkout ${{ github.ref_name }}

      # --profile backup is required: plain `docker compose build` silently skips
      # services behind a profile, which would leave the backup image stale forever
      # after the first deploy.
      - name: Build images
        run: docker compose --profile backup build

      # Dependencies live in the image: the build above is this deploy's `poetry install`,
      # and every step below runs inside it. What was missing is proof that the image can
      # import the code it is about to migrate. Without this, a bad build is discovered by
      # `migrate` — after `down` has stopped the site, against the production database,
      # with only the pre-migration dump standing between it and a manual restore.
      # Deliberately before `down`, so a broken build costs no downtime at all.
      - name: Verify the built image
        run: |
          docker compose run --rm --no-deps marketplace_scraper python -c \
            "import sys, django; print(sys.version); print('Django', django.get_version())"
          docker compose run --rm --no-deps marketplace_scraper python manage.py check

      # Written into .env, not exported for this job, so it survives a manual
      # `docker compose up` or a Pi reboot — every service reads `env_file: .env`.
      # Without this the SDK defaults `environment` to "production" everywhere, which is
      # how developer shell sessions ended up indistinguishable from the Pi in Sentry.
      # Rewritten rather than appended so re-deploying the same tag cannot accumulate
      # duplicate keys (the last one would win, but the file would grow forever).
      - name: Stamp the release into .env
        run: |
          touch .env
          sed -i '/^SENTRY_ENVIRONMENT=/d; /^SENTRY_RELEASE=/d' .env
          printf 'SENTRY_ENVIRONMENT=production\nSENTRY_RELEASE=%s\n' "${{ github.ref_name }}" >> .env
          grep '^SENTRY_' .env

      - name: Stop services
        run: docker compose down

      - name: Start postgres and tor
        run: docker compose up -d postgres tor_proxy

      - name: Wait for postgres
        run: |
          until docker compose exec postgres pg_isready -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      # A bad migration is the likeliest data-loss event on this deployment: it is
      # automated, runs every release, and until now ran against production with no
      # copy taken first (docs/BACKUPS.md §3.1). This makes it reversible.
      # If the dump fails, the deploy stops here — that is intentional.
      - name: Pre-migration backup
        run: |
          mkdir -p backups/pre-deploy
          out="backups/pre-deploy/${{ github.ref_name }}-$(date +%F-%H%M%S).dump"
          tmp="$(mktemp)"
          # Credentials stay inside the container: it already has them via env_file,
          # so nothing is duplicated into the workflow. -T keeps the binary stream intact.
          # -Z6 here (unlike the nightly sidecar) because these copies stay on the Pi
          # and never pass through restic, so pg_dump's own compression is a pure win.
          docker compose exec -T postgres \
            sh -c 'pg_dump -Fc -Z6 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$tmp"
          if [ ! -s "$tmp" ]; then
            echo "Pre-migration dump is empty — refusing to migrate." >&2
            exit 1
          fi
          mv "$tmp" "$out"
          ls -lh "$out"
          # Retain the last 5 releases' worth.
          ls -1t backups/pre-deploy/*.dump | tail -n +6 | xargs -r rm -f

      - name: Run migrations
        run: docker compose run --rm --no-deps marketplace_scraper python manage.py migrate

      - name: Start all services
        run: docker compose up -d
