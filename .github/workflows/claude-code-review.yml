name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# One review per PR at a time. Without this, pushing several commits in quick
# succession starts a full parallel review per push, all racing to comment on
# the same diff; only the newest one is worth paying for.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Gated on author_association - this repo is public, so without it any PR from
    # anyone on the internet would trigger a full review (and spend the linked
    # account's usage) on open.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history, not a shallow clone: the review's value here is largely
          # "does this break an invariant established three commits back", which
          # needs `git diff main...HEAD` and `git log` to answer rather than just
          # the diff the API hands it.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # No effort level here: this is the *plugin* command, which hardcodes the model
          # per agent internally. Effort levels (`low`..`max`) belong to the built-in
          # `/code-review` skill, which is a different implementation.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Both flags are load-bearing, for different reasons:
          #
          #  * `--permission-mode` is what stops tool calls being denied. Agent mode sets
          #    no permission mode at all (tag mode sets `acceptEdits`; see the action's
          #    src/modes/tag/index.ts), and the headless SDK has no prompt handler, so
          #    anything falling through to "ask" is auto-denied. This command drives
          #    Haiku/Sonnet/Opus subagents that reach for ordinary read tools, so an
          #    allowlist cannot be kept complete by hand: 17 denials and a failed run on
          #    PR #73, despite the review itself working.
          #
          #  * `--allowedTools` still matters even under bypass, because agent mode parses
          #    it to decide which GitHub MCP servers to install (src/modes/agent/index.ts
          #    -> prepareMcpConfig). Drop the inline-comment tool from this string and the
          #    server is never installed, so the review has no way to post.
          claude_args: |
            --permission-mode bypassPermissions
            --allowedTools "Task,TodoWrite,Read,Grep,Glob,LS,Bash,mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
