name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# One review per PR at a time. Without this, pushing several commits in quick
# succession starts a full parallel review per push, all racing to comment on
# the same diff; only the newest one is worth paying for.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history, not a shallow clone: the review's value here is largely
          # "does this break an invariant established three commits back", which
          # needs `git diff main...HEAD` and `git log` to answer rather than just
          # the diff the API hands it.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `high` is passed explicitly because a non-interactive run has no
          # remembered effort level to reuse and would fall back to the default.
          prompt: '/code-review:code-review high --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # `--allowedTools` REPLACES the default tool set rather than adding to it,
          # so the read tools must be listed alongside the comment tool. With the
          # comment tool alone the reviewer cannot open a single file: it finished in
          # ~15s over 4 turns and posted nothing (PR #69, run 33120109372).
          claude_args: |
            --allowedTools "Read,Grep,Glob,LS,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
