name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# One review per PR at a time. Without this, pushing several commits in quick
# succession starts a full parallel review per push, all racing to comment on
# the same diff; only the newest one is worth paying for.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history, not a shallow clone: the review's value here is largely
          # "does this break an invariant established three commits back", which
          # needs `git diff main...HEAD` and `git log` to answer rather than just
          # the diff the API hands it.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # No effort level here: this is the *plugin* command, which hardcodes the model
          # per agent internally. Effort levels (`low`..`max`) belong to the built-in
          # `/code-review` skill, which is a different implementation.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # `--allowedTools` REPLACES the default tool set rather than adding to it, so
          # everything the command needs has to be listed. It is agent-driven (it launches
          # Haiku/Sonnet/Opus subagents, hence `Task`) and talks to GitHub over `gh`, so the
          # tools below mirror the `allowed-tools` frontmatter of the plugin's own
          # commands/code-review.md, plus what those subagents need to read the repo.
          claude_args: |
            --allowedTools "Task,TodoWrite,Read,Grep,Glob,LS,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
