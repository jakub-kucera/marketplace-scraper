# Weekly drift check against the live marketplaces — bazos.cz and vinted.cz.
#
# The committed cassettes and fixtures prove the scrapers still handle the
# payloads recorded on the day they were made — not that they handle the sites
# today. This job re-parses the live sites, so partial drift (e.g. view_count
# quietly disappearing) surfaces here instead of in production. The zero-results
# canary in ScrapeRunner already covers the catastrophic case for Bazos.
#
# Vinted is here because the catastrophic case was NOT covered for it: when
# /api/v2/catalog/items was withdrawn (~2026-09-08) every Vinted query failed for
# eight days unnoticed. The runner's per-query guard contained the error, and the
# canary counts rows across all queries in a pass, so Bazos returning rows masked
# Vinted returning none. That case is now caught in production by
# ScrapeRunner._check_query_failure_streaks, so this job is left with partial drift.
#
# While Vinted's Cloudflare challenges the Pi's IP (since 2026-10-08), the Vinted
# tests SKIP instead of erroring. Read the skip reason in the log: a green run can
# mean Vinted was not checked at all.
#
# `pytest -m live` selects every test marked live, so a new marketplace's contract
# tests are picked up here with no change to this file.
#
# Runs on the self-hosted Pi runner, not a GitHub-hosted one: Bazos refuses
# GitHub runner IPs. See docs/research/marketplaces/RECOMMENDATION.md §6 on vantage points.
#
# Deps are installed in a throwaway container rather than on the Pi host, since
# the app image is built with `poetry install --only main` and has no pytest,
# and the host is not assumed to carry poetry at all. `--without notebooks` keeps
# jupyter and its tree out of a slim ARM image that only needs to run the live tests.
#
# NOTE: trigger this once manually (workflow_dispatch) after merging to confirm
# it works on the runner before relying on the schedule.

name: Live contract check

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. Deliberately not more often: this makes real requests
    # to a third-party site we do not own.
    - cron: "0 6 * * 1"

jobs:
  contract:
    runs-on: self-hosted
    # The Pi has a single runner, shared with deploy.yml. A live scrape that
    # stalls would block deploys until someone noticed.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Run live contract tests
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
        run: |
          # The container runs as root against a bind-mounted checkout, so anything
          # it writes there stays root-owned and the next actions/checkout cleanup
          # — which runs as the runner user — fails. Keep it from writing at all:
          # no .pyc files, no .pytest_cache.
          # TEST_DB=sqlite: the rest of the suite runs on real Postgres (see conftest.py),
          # but this container has no database to reach and standing one up on the Pi — next
          # to the production server — would be infrastructure bought for nothing. The Bazos
          # live tests are @pytest.mark.django_db only because parsing a listing writes
          # publisher rows; what they actually assert is live-site parsing, so the backend is
          # irrelevant to them. Do not copy this into any other job.
          #
          # This job globs `-m live` across the repo, so it also covers
          # refprice/tests/test_zbozi_contract.py — the drift check on Zbozi's unsupported
          # /api/v3 surface, which touches no database at all. Unlike Bazos, Zbozi does not
          # block datacenter or runner IPs, so that half would run anywhere; it lives here
          # because weekly is the right cadence for it, not because the Pi is required.
          docker run --rm \
            -v "$PWD:/app" -w /app \
            -e SECRET_KEY="$SECRET_KEY" \
            -e TEST_DB=sqlite \
            -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim \
            sh -c "pip install --quiet poetry==2.4.1 && \
                   poetry config virtualenvs.create false && \
                   poetry install --no-root --without notebooks --no-interaction --no-ansi && \
                   pytest -m live -v -rs -p no:cacheprovider"
