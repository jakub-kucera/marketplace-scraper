[tool.poetry]
name = "scraper"
version = "0.1.0"
description = ""
authors = ["Jakub Kucera <jakub.kucerja@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
# The `socks` extra is load-bearing: the Tor transport proxies through socks5h://
# (ip_changer/tor.py), which requests cannot do without PySocks. It used to arrive
# transitively via selenium's `urllib3[socks]`, so declaring it here is what keeps
# Tor working now that selenium is gone.
requests = {extras = ["socks"], version = "^2.32"}
discord-notify = "^1.0.0"
beautifulsoup4 = "^4.12"
requests-random-user-agent = "^2023.2.15"
python-dotenv = "^1.0.0"
pytz = "^2026.3"
stem = "^1.8.2"
django = "^5.2"
django-extensions = "^4.1"
django-environ = "^0.12"
django-db-logger = "*"
sentry-sdk = {extras = ["django"], version = "*"}
psycopg2-binary = "^2.9.10"
vinted-scraper = "^4.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
# mypy is held in the 1.18 line to match django-stubs 5.2.x's `compatible-mypy`
# range (>=1.13,<1.19). The stubs ship a mypy plugin, and the plugin API is what
# breaks across mypy minors — not the type checks themselves.
mypy = "~1.18"
django-stubs = "^5.2.7"
django-stubs-ext = "^5.2.7"
pytest-django = "^4.11"
pytest-mock = "^3.14"
model-bakery = "^1.20"
typing-extensions = "^4.12"
types-requests = "^2.32"
ruff = "^0.15.22"
# Was pinned to 7.x because vcrpy 8 dropped urllib3 v1, which requests 2.28 and
# selenium 4.8 forbade us leaving. That inverted when those two went: 7.0's
# `urllib3<2; platform_python_implementation == "PyPy"` marker is enough to make
# Poetry resolve the whole graph to urllib3 v1, which no longer solves. 8.x is the
# version that matches a urllib3 v2 stack. Cassette format is unchanged between the
# two; bazos/tests/cassettes replay is the regression net.
# See docs/archive/shipped/E2E_REPLAY_TESTING.md 4.1.
vcrpy = "^8.0"
pytest-recording = "^0.13"

# Jupyter is only for the experiments/ notebooks — it is not needed to run the
# tests, and it is by far the heaviest thing in the lock. Split into its own group
# so short-lived environments can skip it with `--without notebooks`; a plain
# `poetry install` still installs it, so local dev is unchanged.
types-pytz = "^2026"
[tool.poetry.group.notebooks.dependencies]
jupyter = "^1.0.0"

# Training and offline analysis only, and `optional = true` on purpose: nothing installs
# this unless asked (`poetry install --with ml`). Serving never needs it -- a price model
# ships as a JSON manifest evaluated in pure Python, precisely so the ARM64 runtime image
# does not carry numpy/scipy/sklearn (docs/proposals/ML_PRICE_SCORING.md §4.1). A
# non-optional group would land it in CI and in the weekly contract-check container too.
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
scikit-learn = "^1.5"
pandas = "^2.2"
numpy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
exclude = [
    "old_tests",
    "experiments",
    "bazos_app_decomplied",
    "data_export_23_3_2024",
    "*/migrations/*",
    # Dead/broken code, not wired into any runtime path (see CLAUDE.md).
    "bazos/scraping/bazos/bazos_scraper_click.py",
    "bazos/scraping/notifier.py",
    "senders/services/slack_sender.py",
    "senders/services/email_sender.py",
    "senders/services/calendar_api/calendar_condition_sender.py",
]

[tool.ruff.lint]
# Default rule set only (pyflakes "F" + a slice of pycodestyle "E"/"W"):
# unused imports/vars, undefined names, bare excepts, etc. No import
# sorting, docstrings, or style/formatting rules enabled on purpose.

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = '''(?x)(
    ^(old_tests|experiments|bazos_app_decomplied|data_export_23_3_2024)/
    | /migrations/
    | ^bazos/scraping/bazos/bazos_scraper_click\.py$
    | ^bazos/scraping/notifier\.py$
    | ^senders/services/slack_sender\.py$
    | ^senders/services/email_sender\.py$
    | ^senders/services/calendar_api/calendar_condition_sender\.py$
    | ^ip_changer/openvpn\.py$
    | ^verify_ip_changer\.py$
    | ^bazos/scraping/selenium_driver\.py$
)'''
ignore_missing_imports = true
check_untyped_defs = true
# Intentionally lenient: no --strict, no disallow_untyped_defs. We want
# real type errors caught, not full annotation coverage enforced.
# union-attr disabled: on this codebase it's overwhelmingly Django
# FK/session/mock Optional-narrowing noise rather than real bugs, not
# an "obvious issue" worth gating on. django-stubs' related-manager
# resolution errors are suppressed inline (per-line, not a real code
# in this mypy version's registry).
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
# Test-only patterns that are correct at runtime but violate static
# contracts on purpose: passing `ad=None` to DB-free filter-engine
# tests, mocking urllib.error.HTTPError with loose arg types, and the
# standard Django idiom for attaching a messages backend to a bare
# RequestFactory request.
module = "*.tests.*"
disable_error_code = ["arg-type", "assignment", "attr-defined"]

[tool.django-stubs]
django_settings_module = "scraper.settings"
