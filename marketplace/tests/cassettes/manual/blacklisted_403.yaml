# Hand-written, not recorded: a Bazos IP ban cannot be provoked on demand, and
# provoking one deliberately would be both rude and self-defeating.
#
# Shape is taken from the live-verified behaviour of the block (403 on the
# request path, no Retry-After, no 429 stage). Served for both the listing path
# and the /search.php blacklist probe, so one cassette covers
# `run_query` raising MarketplaceBlockedError and `check_blacklisted()` returning
# True. Matched on method+path only — the query string is irrelevant to a ban.
#
# The body is the real one, byte for byte as measured live 2026-08-29 (82 bytes,
# nginx's own deny page). It matters that it stays real: the IP it names is the
# only trustworthy record of which exit node was blocked, and
# `MarketplaceBlockedError.from_response` parses it out of exactly this string.
interactions:
- request:
    body: null
    headers:
      Accept:
      - '*/*'
      Accept-Encoding:
      - gzip, deflate
      Connection:
      - keep-alive
    method: GET
    uri: https://pc.bazos.cz/notebook/0/?hledat=thinkpad+x230&hlokalita=&humkreis=25&cenaod=&cenado=&Submit=Hledat
  response:
    body:
      string: "<H1>Forbidden</H1>You don't have permission to access this server. IP: 37.114.63.5"
    headers:
      Content-Type:
      - text/html
    status:
      code: 403
      message: Forbidden
- request:
    body: null
    headers:
      Accept:
      - '*/*'
      Accept-Encoding:
      - gzip, deflate
      Connection:
      - keep-alive
    method: GET
    uri: https://www.bazos.cz/search.php?hledat=iphone&rubriky=www&hlokalita=&humkreis=25&cenaod=&cenado=&Submit=Hledat&kitx=ano
  response:
    body:
      string: "<H1>Forbidden</H1>You don't have permission to access this server. IP: 37.114.63.5"
    headers:
      Content-Type:
      - text/html
    status:
      code: 403
      message: Forbidden
version: 1
