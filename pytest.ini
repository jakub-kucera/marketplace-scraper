[pytest]
DJANGO_SETTINGS_MODULE = scraper.settings
norecursedirs = old_tests postgres_data .venv
markers =
    live: hits the real bazos.cz. Excluded from the default run and from CI; see bazos/tests/live/.
# Live tests are opt-in: `pytest -m live`. Without this, a plain `pytest` would
# start making real requests to Bazos from every dev machine and CI runner.
addopts = -m "not live"
