[pytest]
DJANGO_SETTINGS_MODULE = scraper.settings
# `.claude` holds agent-created git worktrees — full copies of this repo. Collecting them
# aborts the whole run with ImportPathMismatchError on the duplicated conftest, so a bare
# `pytest` fails while `pytest bazos/` passes, which is a confusing way to find out.
norecursedirs = old_tests postgres_data .venv .claude
markers =
    live: hits a real marketplace (bazos.cz, zbozi.cz). Excluded from the default run and from CI; see bazos/tests/live/ and refprice/tests/test_zbozi_contract.py.
# Live tests are opt-in: `pytest -m live`. Without this, a plain `pytest` would
# start making real requests to Bazos from every dev machine and CI runner.
addopts = -m "not live"
